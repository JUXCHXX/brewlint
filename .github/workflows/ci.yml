name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # No setup-maven step: the committed Maven Wrapper is the point. It proves the project
      # builds for anyone without Maven installed, which is the same promise the npm distribution
      # will make in Hito 3.
      - name: Build and test
        run: ./mvnw --batch-mode verify

  self-check:
    name: Self-check on fixtures
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The same promise as above, exercised end to end: the fat jar has to run on a machine that
      # only has a JDK, and it has to find the problems the README claims. This step is also the
      # guard against the quiet ServiceLoader failure: if the shade plugin stops merging
      # META-INF/services, the jar discovers zero rules, reports "No findings" and exits 0, and
      # this assertion is what catches it.
      - name: Package the CLI
        run: ./mvnw --batch-mode -DskipTests package

      - name: Run the CLI against the broken fixtures
        run: |
          set -euo pipefail
          JAR=$(ls brewlint-cli/target/brewlint-cli-*.jar | head -1)
          java -jar "$JAR" scan --path fixtures --no-color > report.txt || EXIT=$?
          cat report.txt
          # Exit 1 is the expected result: the fixtures are broken on purpose.
          if [ "${EXIT:-0}" != "1" ]; then
            echo "::error::expected exit code 1 from the fixtures scan, got ${EXIT:-0}"
            exit 1
          fi
          # Every rule has to fire on something. A rule that never fires is either broken or
          # pointless, and no unit test can tell the difference on its own.
          for RULE in AOP001 BEAN001 BEAN002 BEAN003 RES001 RES002 TX002 TX003; do
            grep -q "$RULE" report.txt || {
              echo "::error::$RULE was not reported; the shaded jar likely lost its rule discovery"
              exit 1
            }
          done

      - name: The correct fixtures must stay clean
        run: |
          set -euo pipefail
          JAR=$(ls brewlint-cli/target/brewlint-cli-*.jar | head -1)
          java -jar "$JAR" scan --path fixtures/src/main/java/com/example/correct --no-color | tee clean.txt
          grep -q "No findings" clean.txt || {
            echo "::error::a false positive landed in the deliberately correct fixtures"
            exit 1
          }

      # The JSON output is the contract Hito 6 (VS Code) and Hito 7 (GitHub Action) will be written
      # against. Checking it parses here means a broken serializer fails the build now, rather than
      # after those clients are built on top of it.
      - name: The JSON output must be valid and complete
        run: |
          set -euo pipefail
          JAR=$(ls brewlint-cli/target/brewlint-cli-*.jar | head -1)
          java -jar "$JAR" scan --path fixtures --format json --output report.json || true
          python3 - <<'PY'
          import json
          with open("report.json", encoding="utf-8") as handle:
              report = json.load(handle)
          assert isinstance(report["counts"], dict), "counts must be an object, not a string"
          assert isinstance(report["findings"], list), "findings must be an array, not a string"
          assert report["findings"], "expected findings in the broken fixtures"
          for finding in report["findings"]:
              for key in ("ruleId", "severity", "file", "line", "column", "message", "suggestion"):
                  assert key in finding, f"missing key {key}"
          ids = {finding["ruleId"] for finding in report["findings"]}
          expected = {"AOP001", "BEAN001", "BEAN002", "BEAN003", "RES001", "RES002", "TX002", "TX003"}
          assert expected <= ids, f"missing rules in JSON: {sorted(expected - ids)}"
          print(f"JSON OK: {len(report['findings'])} findings, rules {sorted(ids)}")
          PY

      # The packaged binary and the npm install are separate promises from the fat jar, and both
      # have failure modes that no unit test can reach. test-install.mjs builds the app image, packs
      # the packages, installs from the tarballs and runs the result with no JDK on PATH. The
      # release workflow runs the same script on all three platforms; running it here too means a
      # packaging regression shows up on a normal push instead of at release time.
      - name: Build the self-contained runtime image
        run: ./scripts/build-runtime.sh

      - name: Verify the npm install works with no Java
        run: |
          node npm/scripts/assemble-platform-packages.mjs
          node npm/scripts/test-install.mjs

      - name: Launcher unit tests
        run: node --test npm/brewlint/test/
