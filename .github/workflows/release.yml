name: Release

# Publishing is a separate workflow from CI on purpose. CI runs on every push and must stay fast and
# free; this one creates permanent public artefacts, so it only runs on a tag.
#
# Why a matrix at all: jpackage links a launcher for the host OS and architecture, so a macOS machine
# physically cannot produce a Linux binary. Each target has to be built on that platform. There is
# no clever workaround, and pretending otherwise is how you ship a package that only works on the
# maintainer's laptop.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and verify, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify-install:
    name: Verify the packaged install
    runs-on: ${{ matrix.os }}
    # Declared once for the whole job rather than per step. Every step here sources a bash script
    # and uses `set -euo pipefail`, and PowerShell rejects the latter outright. Declaring it at the
    # step level is a rule a new step can forget; declaring it here is a rule that cannot be missed.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            jpackage-target: macos-aarch64
            npm-name: macos-arm64
            arch: arm64
          - os: ubuntu-latest
            jpackage-target: linux-x64
            npm-name: linux-x64
            arch: x64
          - os: windows-latest
            jpackage-target: windows-x64
            npm-name: win-x64
            arch: x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The tag is the authority on what version this build is. A manual dry run is on a branch, and
      # a branch name is not a version, so it gets the development one.
      - name: Work out the version to stamp
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            REVISION="${GITHUB_REF_NAME#v}"
          else
            REVISION="0.1.0-SNAPSHOT"
          fi
          echo "REVISION=${REVISION}" >> "$GITHUB_ENV"
          echo "    ${GITHUB_REF_NAME} -> ${REVISION}"

      - name: Build and run the tests
        run: ./mvnw --batch-mode verify

      # PowerShell also resolves a bare relative path against the working directory while bash
      # resolves it against $PATH first, so `Run ./scripts/build-runtime.sh` found no script, exited
      # 0 with no output, and the failure only surfaced three steps later as "no platform packages
      # were assembled". The guards are what make that class of silent failure impossible.
      - name: Build the runtime image
        run: |
          set -euo pipefail
          source scripts/ci-guard.sh
          ./scripts/build-runtime.sh ${{ matrix.jpackage-target }} | tee dist-build.log
          # The script renders both report formats from the packaged binary before it exits, because
          # a jlink image is closed at build time and a missing JDK module only shows up when the
          # code path that needs it runs. Assert the log says so, rather than trusting that it did.
          require_success_marker "pdf report: ok" "the packaged binary could not render a PDF" dist-build.log
          require_success_marker "json report: ok" "the packaged binary could not render JSON" dist-build.log
          # The binary stamped with the version being released, checked from the log the build
          # already produced. A package published under one number and containing a binary that
          # reports another is untraceable, and it happened once.
          require_success_marker "brewlint ${REVISION}" \
            "the packaged binary was not stamped with the version being released" dist-build.log
          require_output "the runtime image" "dist/${{ matrix.npm-name }}/**/*"
          require_output "the recorded launcher path" "dist/launcher-${{ matrix.npm-name }}.txt"

      - name: Assemble and pack the npm packages
        run: |
          set -euo pipefail
          source scripts/ci-guard.sh
          node npm/scripts/assemble-platform-packages.mjs --pack | tee assemble.log
          require_output "the platform package" "npm/platform/${{ matrix.npm-name }}/package.json"
          require_success_marker "match the build" "the launcher path table is out of date" assemble.log
          require_output "the npm tarball" "build/*.tgz"

      # The real deliverable of Hito 3. It installs from tarballs the way npm would serve them and
      # runs the binary with no JDK reachable on PATH, which is the only honest way to check the
      # claim "installs anywhere, needs no Java".
      - name: Verify the install works with no Java
        run: |
          set -euo pipefail
          source scripts/ci-guard.sh
          node npm/scripts/test-install.mjs | tee install.log
          require_success_marker "PASS" "the npm install verification did not pass" install.log

      - name: Upload the platform package
        uses: actions/upload-artifact@v4
        with:
          name: brewlint-${{ matrix.npm-name }}
          path: build/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to npm
    needs: verify-install
    runs-on: ubuntu-latest
    # Only a real tag push publishes. A manual run verifies and stops, so the workflow can be
    # exercised without creating permanent public packages.
    if: startsWith(github.ref, 'refs/tags/v')
    # Kept even though it holds no secret any more. It is the manual approval gate in front of an
    # irreversible action, and it is also the environment name the npm trusted publisher is
    # configured against, so removing it would break authentication as well as the gate.
    environment: npm
    permissions:
      # The whole of the authentication. OIDC trusted publishing: GitHub mints a short-lived,
      # workflow-scoped token and npm exchanges it for a publish token scoped to the exact
      # repository, workflow and environment configured on the package. There is no long-lived
      # credential anywhere in this repository, and the npm account has tokens disabled.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24, not 20. Trusted publishing requires npm CLI 11.5.1+ and Node 22.14.0+, and
          # node 20 ships npm 10, which has no OIDC support at all. Bumped now rather than at the
          # moment of switching to OIDC, because the version is what makes the switch possible and
          # a version bump is not something to discover during a release.
          node-version: '24'
          # Kept, with no token to go with it. This writes the registry into .npmrc so the CLI knows
          # where to exchange the OIDC token, which is the documented shape for trusted publishing.
          # It also leaves an unresolved ${NODE_AUTH_TOKEN} in that file, which npm ignores once it
          # sees the OIDC environment; the account has tokens disabled, so there is nothing for it
          # to fall back to and nothing to fall back to.
          registry-url: https://registry.npmjs.org

      - name: Read the version from the main package
        id: version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./npm/brewlint/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # The tag decides that this runs; the manifest decides what gets published. If they
          # disagree, the run republishes the manifest's version under a different tag, and npm
          # rejects the first attempt as a version that already exists. Failing here says which of
          # the two is wrong, instead of leaving a half-finished release to work out from a 403.
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the manifest version $VERSION"
            echo "  Bump npm/brewlint/package.json (and the three optionalDependencies) to $TAG_VERSION," >&2
            echo "  or tag v$VERSION instead." >&2
            exit 1
          fi
          echo "    tag $GITHUB_REF_NAME matches manifest $VERSION"

      - name: Collect the platform tarballs built by the matrix
        uses: actions/download-artifact@v4
        with:
          path: tarballs
          merge-multiple: true

      - name: Pack the main package
        run: |
          mkdir -p tarballs
          cd npm/brewlint
          npm pack --pack-destination ../../tarballs

      # Every tarball is proved publishable before any of them is published for real.
      #
      # `npm publish <path>` takes a package *specifier*, not a filename. A bare relative path
      # containing a slash is GitHub shorthand, so `tarballs/brewlint-linux-x64-0.1.0.tgz` was
      # resolved as owner=tarballs, repo=brewlint-linux-x64-0.1.0.tgz, and npm tried to
      # `git clone ssh://git@github.com/tarballs/...` and failed with a publickey error. The
      # tarball existed and was valid; the argument was read as something else entirely.
      #
      # This step is the reason that bug can never reach a real publish again. `npm publish
      # --dry-run` parses the same specifier, resolves it, and prints the manifest, without
      # contacting the registry. The release path was exercised by dry runs of the workflow for
      # three milestones and none of them got here, because the publish job is skipped on a
      # non-tag ref. A guard that only runs in the one situation it is guarding is not a guard.
      - name: Prove every tarball is publishable
        run: |
          set -euo pipefail
          shopt -s nullglob
          ALL_TARBALLS=(tarballs/*.tgz)
          if [ ${#ALL_TARBALLS[@]} -eq 0 ]; then
            echo "::error::no tarballs were produced by the matrix"
            exit 1
          fi
          for TARBALL in "${ALL_TARBALLS[@]}"; do
            # Absolute, never bare-relative: npa treats a slashed relative path as GitHub
            # shorthand, and an absolute path cannot be mistaken for anything else.
            ABSOLUTE="$GITHUB_WORKSPACE/$TARBALL"
            echo "::group::dry-run $TARBALL"
            npm publish "$ABSOLUTE" --dry-run --access public 2>&1 | grep -E "^npm notice (name|version):" || {
              echo "::error::$TARBALL is not a publishable package"
              exit 1
            }
            echo "::endgroup::"
          done
          echo "    all ${#ALL_TARBALLS[@]} tarballs are publishable"

      # The platform packages must exist before the main package is published, because the main
      # package's optionalDependencies name them at exact versions. Publishing it first would give
      # every user an install that silently downloads nothing.
      - name: Publish the platform packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          PLATFORM_TARBALLS=(tarballs/brewlint-*-"${{ steps.version.outputs.version }}".tgz)
          if [ ${#PLATFORM_TARBALLS[@]} -eq 0 ]; then
            echo "::error::no platform tarballs were produced by the matrix"
            exit 1
          fi
          for TARBALL in "${PLATFORM_TARBALLS[@]}"; do
            echo "::group::publish $TARBALL"
            npm publish "$GITHUB_WORKSPACE/$TARBALL" --provenance --access public
            echo "::endgroup::"
          done

      - name: Publish the main package last
        run: |
          set -euo pipefail
          npm publish "$GITHUB_WORKSPACE/tarballs/brewlint-${{ steps.version.outputs.version }}.tgz" \
            --provenance --access public

      - name: Verify the published install
        run: |
          set -uo pipefail
          # Install from the registry exactly as a user would, in a directory that has never seen
          # this repository. Anything less proves nothing about what users actually get.
          #
          # With a retry, because the registry does not serve a version the instant it is published.
          # npm scans a new version for malware before making it available, and on v0.1.1 that took
          # about two minutes. Installing once, immediately, failed with ETARGET on a release that
          # had in fact published all four packages perfectly: a red build reporting a success.
          #
          # That failure mode is worse than a false negative, because the instinct on seeing a red
          # release is to re-run it, and re-running republishes a version that already exists. So the
          # wait is here, with a bound, and it still fails if the version really is not there.
          VERSION="${{ steps.version.outputs.version }}"
          ATTEMPT=0
          until npm view "brewlint@$VERSION" version >/dev/null 2>&1; do
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -ge 20 ]; then
              echo "::error::brewlint@$VERSION is still not on the registry after 20 attempts"
              exit 1
            fi
            [ "$ATTEMPT" -eq 1 ] && echo "    waiting for the registry to serve $VERSION..."
            sleep 15
          done
          echo "    registry has brewlint@$VERSION (after $ATTEMPT attempt(s))"
          set -e

          WORKDIR=$(mktemp -d)
          npm install --prefix "$WORKDIR" --no-audit --no-fund "brewlint@$VERSION"
          "$WORKDIR/node_modules/.bin/brewlint" --version

          # The platform package has to be there, not just the main one. npm skips an optional
          # dependency whose os and cpu do not match, so a main package that installs cleanly while
          # silently pulling down no binary at all is a passing result that means nothing. The
          # launcher resolving the binary is the proof that optionalDependencies still line up
          # with the shim's platform table, which is the seam the scope rename cut.
          PLATFORM_PACKAGE=$(node -p "
            Object.keys(require('$WORKDIR/node_modules/brewlint/package.json').optionalDependencies)
              .find((name) => {
                const manifest = require('$WORKDIR/node_modules/' + name + '/package.json');
                return manifest.os.includes(process.platform) && manifest.cpu.includes(process.arch);
              }) ?? ''
          ")
          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo "::error::no platform package matched this runner, so the install carries no binary"
            exit 1
          fi
          echo "    platform package: $PLATFORM_PACKAGE"

          # The fixtures are broken on purpose, so exit 1 here is the correct result.
          "$WORKDIR/node_modules/.bin/brewlint" scan --path "$GITHUB_WORKSPACE/fixtures" --no-color || true

          # The PDF is the feature most likely to break on a jlink module list, so it is checked
          # here from the published package rather than only from a build.
          "$WORKDIR/node_modules/.bin/brewlint" scan --path "$GITHUB_WORKSPACE/fixtures" \
            --format pdf --output "$WORKDIR/report.pdf" --fail-on none
          head -c 5 "$WORKDIR/report.pdf" | grep -q '%PDF-' || {
            echo "::error::the published binary could not render a PDF"
            exit 1
          }
          echo "    pdf report: ok ($(du -h "$WORKDIR/report.pdf" | cut -f1))"
