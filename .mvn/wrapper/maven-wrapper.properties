wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip

# No distributionSha256Sum on purpose.
#
# maven-wrapper validates the downloaded distribution with `sha256sum -c`, and it looks for
# sha256sum before shasum. macOS ships /sbin/sha256sum, which is a stub with no `-c` support, so
# the check always fails there and ./mvnw aborts with "your Maven distribution might be
# compromised". Since this project is meant to be cloned on macOS, that is not a trade-off worth
# making: the distribution is fetched over HTTPS from Maven Central instead.
#
# On Linux and Windows CI, `sha256sum -c` would work, so if you ever want the check back, set
# distributionSha256Sum to the SHA-256 of apache-maven-3.9.9-bin.zip and make sure contributors
# have GNU coreutils' sha256sum ahead of /sbin in their PATH.
